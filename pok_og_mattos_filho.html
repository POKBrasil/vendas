<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POK × Mattos Filho · OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    font-family: 'Poppins', sans-serif;
    background: #2d1659;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #2d1659;
    overflow: hidden;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Bolhas decorativas — assinatura visual do hero POK */
  .bubble-a { position: absolute; top: -180px; right: -160px; width: 540px; height: 540px; border-radius: 50%; background: rgba(123, 79, 207, 0.32); }
  .bubble-b { position: absolute; bottom: -180px; left: 12%; width: 380px; height: 380px; border-radius: 50%; background: rgba(255, 255, 255, 0.045); }
  .bubble-c { position: absolute; top: 35%; left: -120px; width: 260px; height: 260px; border-radius: 50%; background: rgba(123, 79, 207, 0.14); }

  /* Topo — logo + eyebrow */
  .top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .logo svg { height: 48px; width: auto; display: block; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(228, 220, 247, 0.18);
    border: 1px solid rgba(228, 220, 247, 0.32);
    border-radius: 99px; padding: 9px 20px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #e4dcf7;
  }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: #e4dcf7; display: inline-block; }

  /* Centro — título + subtítulo */
  .middle { position: relative; z-index: 2; margin-top: 6px; }
  .title { font-size: 64px; font-weight: 900; line-height: 1.07; color: #ffffff; letter-spacing: -0.025em; max-width: 1000px; }
  .title .accent { color: #b89dec; }
  .subtitle { margin-top: 22px; font-size: 21px; line-height: 1.45; font-weight: 400; color: rgba(255, 255, 255, 0.82); max-width: 900px; }

  /* Rodapé — pílulas de eixos + domínio */
  .bottom { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .tracks { display: flex; gap: 14px; }
  .track-pill { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 99px; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .track-pill .pdot { width: 9px; height: 9px; border-radius: 50%; }
  .track-edu { background: #DBEAFE; color: #1E40AF; }
  .track-edu .pdot { background: #3B82F6; }
  .track-corp { background: #E2F4EB; color: #0f6e56; }
  .track-corp .pdot { background: #1D9E75; }
  .domain { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: rgba(228, 220, 247, 0.65); text-transform: uppercase; }
</style>
</head>
<body>

<div class="canvas">

  <div class="bubble-a"></div>
  <div class="bubble-b"></div>
  <div class="bubble-c"></div>

  <!-- TOPO -->
  <div class="top">
    <div class="logo">

      </svg>
    </div>
    <div class="eyebrow">
      <span class="dot"></span>
      <span>Mattos Filho Advogados</span>
    </div>
  </div>

  <!-- CENTRO -->
  <div class="middle">
    <h1 class="title">
      Prova auditável para<br/>
      cadeias de <span class="accent">compliance</span>
    </h1>
    <p class="subtitle">
      A infraestrutura de credenciais em blockchain que torna auditável<br/>
      cada evidência de capital humano e compliance.
    </p>
  </div>

  <!-- RODAPÉ -->
  <div class="bottom">
    <div class="tracks">
      <div class="track-pill track-edu">
        <span class="pdot"></span>
        <span>Capital humano</span>
      </div>
      <div class="track-pill track-corp">
        <span class="pdot"></span>
        <span>Compliance</span>
      </div>
    </div>
    <div class="domain">pok.tech</div>
  </div>

</div>
</body>
</html>
